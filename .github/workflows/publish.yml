name: Publish image

# Pushes the server image to ghcr.io/<owner>/<repo> when a version tag
# (e.g. v1.2.0) is pushed. Tags produced: 1.2.0, 1.2, latest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The whole of ci.yml, so a tag on a commit that fails it never ships.
  ci:
    name: CI
    uses: $/.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No QEMU needed for arm64: the Dockerfile installs the packages for
      # the target platform on the runner's own CPU and runs nothing in the
      # arm64 stage.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          # arm64 so it also runs on a Raspberry Pi / ARM VPS.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # vX.Y.Z on a release; a manual dispatch's branch name never
          # counts as one (gcm/config.py SERVER_VERSION).
          build-args: GCM_VERSION=${{ github.ref_name }}
          # A registry cache rather than type=gha: the Actions cache a tag
          # run writes can't be read by the next tag's run, so every
          # release would start cold. Spelled out because image refs must
          # be lowercase and github.repository isn't.
          cache-from: type=registry,ref=ghcr.io/maselkov/gtnh-craft-monitor:buildcache
          cache-to: type=registry,ref=ghcr.io/maselkov/gtnh-craft-monitor:buildcache,mode=max

  # A GitHub Release for the tag, with notes listing the PRs since the last
  # one, so there's a changelog and Watch -> Releases notifies. gcm and the
  # Status dialog still find versions by tag, not by release. After publish,
  # not deploy: the image is public by then, whatever happens to our server.
  release:
    name: Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --generate-notes counts from the last *release* by default, and
        # older versions have none, so start from the previous version tag.
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" ${prev:+--notes-start-tag "$prev"}

  # Runs on the self-hosted runner, which SSHes to the deployment host. The
  # deploy key there is locked to a forced command (deploy/gcm-deploy.sh), so
  # all this job - or anyone holding the key - can do is deploy a released
  # version. The repo is never checked out on either machine.
  deploy:
    name: Deploy
    needs: publish
    # Only release tags deploy; a manual dispatch just publishes the image.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, gcm-deploy]
    # Protection rules (allowed tags, reviewers) and the SSH key live here.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          (umask 077 && printf '%s\n' "$SSH_KEY" > "$dir/key")
          printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts"
          # The short-lived job token goes over stdin so the deployment host
          # can pull from GHCR without storing any registry credentials.
          # Deploys the exact version this run built (v1.2.0 -> 1.2.0).
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" |
            ssh -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" \
              "$DEPLOY_HOST" "deploy ${GITHUB_REF_NAME#v}"
