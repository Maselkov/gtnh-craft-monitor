name: Icon export image

# Builds the image gtnh-data.yml exports with, which compiles the export
# mod, so a change that breaks either fails here instead of in the next
# nightly data build. Exporting needs a whole pack, so nothing runs it.
# Writes the same build cache as gtnh-data.yml: after a merge to main,
# the next data build starts warm.

on:
  push:
    branches: [main]
    paths:
      - "tools/icon-export/**"
      - ".github/workflows/icon-export.yml"
  pull_request:
    paths:
      - "tools/icon-export/**"
      - ".github/workflows/icon-export.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build icon export image
    runs-on: ubuntu-latest
    # A cold build (mod changed, or the cache expired) takes about 6 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/icon-export
          push: false
          cache-from: type=gha,scope=icon-export
          cache-to: type=gha,scope=icon-export,mode=max
