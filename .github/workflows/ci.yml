name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the python:3.12-slim base image in server/Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/tests/requirements-test.txt
      - run: pip install -r server/tests/requirements-test.txt
      - run: python -m pytest -q
        working-directory: server

  lua:
    name: Lua syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # OpenComputers' default architecture is Lua 5.3.
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: |
          status=0
          for f in oc/*.lua; do
            luac5.3 -p "$f" || status=1
          done
          exit $status
      # gcm.lua installs whatever manifest.lua lists, so a renamed or
      # deleted script would otherwise only fail on someone's computer.
      - name: Check gcm manifest
        run: |
          lua5.3 -e '
            local m = dofile("oc/manifest.lua")
            local files = { m.config }
            for _, f in ipairs(m.shared) do files[#files + 1] = f end
            for _, c in ipairs(m.components) do
              for _, f in ipairs(c.files) do files[#files + 1] = f end
            end
            local missing = 0
            for _, f in ipairs(files) do
              if not io.open("oc/" .. f.src) then
                print("manifest.lua lists missing file oc/" .. f.src)
                missing = missing + 1
              end
            end
            os.exit(missing == 0)
          '

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
