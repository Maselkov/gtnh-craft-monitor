services:
  gtnh-craft-monitor:
    build: ./server
    container_name: gtnh-craft-monitor
    restart: unless-stopped
    ports:
      - "8420:8420"
    environment:
      # The in-game scripts' shared secret. Leave it unset to have one
      # generated into data/api_key on first start.
      - API_KEY=${API_KEY:-}
      - STALE_AFTER_SECONDS=30
      # The direct Compose port is HTTP-only. Keep this at 0 only for a
      # trusted local/LAN deployment; use HTTPS plus 1 behind a proxy.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
      # Comma-separated proxy IPs/CIDRs allowed to supply X-Forwarded-* headers.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Optional: post notifications to Discord or another webhook.
      - WEBHOOK_URLS=${WEBHOOK_URLS:-}
      - WEBHOOK_EVENTS=${WEBHOOK_EVENTS:-crafts,autocraft}
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Stock history thinning: one value per item per hour after this
      # many days, per day after the second; 0 keeps everything.
      - HISTORY_HOURLY_AFTER_DAYS=${HISTORY_HOURLY_AFTER_DAYS:-30}
      - HISTORY_DAILY_AFTER_DAYS=${HISTORY_DAILY_AFTER_DAYS:-365}
    volumes:
      # Databases and downloaded game data (item icons, catalog) - without
      # this, every `docker compose up -d --build` would wipe the history.
      - ./server/data:/app/data
