services:
  gtnh-craft-monitor:
    build: ./server
    container_name: gtnh-craft-monitor
    restart: unless-stopped
    ports:
      - "8420:8420"
    environment:
      - API_KEY=${API_KEY:?Set API_KEY to a unique 32+ character secret in .env}
      - STALE_AFTER_SECONDS=30
      # The direct Compose port is HTTP-only. Keep this at 0 only for a
      # trusted local/LAN deployment; use HTTPS plus 1 behind a proxy.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
      # Comma-separated proxy IPs/CIDRs allowed to supply X-Forwarded-* headers.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Set these in .env before first startup to create the initial admin.
      - GCM_BOOTSTRAP_ADMIN_TOKEN=${GCM_BOOTSTRAP_ADMIN_TOKEN:-}
      - GCM_BOOTSTRAP_ADMIN_NAME=${GCM_BOOTSTRAP_ADMIN_NAME:-Administrator}
    volumes:
      # Without this, power.db (written at runtime inside the container)
      # gets silently wiped on every `docker compose up -d --build` -
      # rebuilding for anything unrelated (an icon update, say) would
      # otherwise erase your whole power history. This bind-mounts the
      # same directory the Dockerfile bakes icons_lookup.json/images.zip
      # from, so it also means you can update those in place on the host
      # without a rebuild at all.
      - ./server/data:/app/data
