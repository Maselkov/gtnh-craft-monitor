# Compose file for running a published image (see README, "Prebuilt
# image"). On the deployment host it sits in DEPLOY_DIR beside .env and
# data/; gcm-deploy.sh sets GCM_TAG to the release it deploys.
services:
  gtnh-craft-monitor:
    image: ghcr.io/maselkov/gtnh-craft-monitor:${GCM_TAG:-latest}
    container_name: gtnh-craft-monitor
    restart: unless-stopped
    ports:
      - "8420:8420"
    environment:
      - API_KEY=${API_KEY:?Set API_KEY to a unique 32+ character secret in .env}
      - STALE_AFTER_SECONDS=30
      # The direct port is HTTP-only. Keep this at 0 only for a trusted
      # local/LAN deployment; use HTTPS plus 1 behind a proxy.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
      # Comma-separated proxy IPs/CIDRs allowed to supply X-Forwarded-* headers.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Set these in .env before first startup to create the initial admin.
      - GCM_BOOTSTRAP_ADMIN_TOKEN=${GCM_BOOTSTRAP_ADMIN_TOKEN:-}
      - GCM_BOOTSTRAP_ADMIN_NAME=${GCM_BOOTSTRAP_ADMIN_NAME:-Administrator}
    volumes:
      # Databases and downloaded game data (item icons, catalog).
      - ./data:/app/data
