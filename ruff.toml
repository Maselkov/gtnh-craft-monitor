# CI runs `ruff check` (see .github/requirements-lint.txt for the version).
target-version = "py314"

[lint]
# Pyflakes, the error-level pycodestyle checks and bugbear: likely bugs,
# not style.
select = ["E4", "E7", "E9", "F", "B"]

[lint.per-file-ignores]
# Test modules share fixtures by importing them, and a test's parameter of
# the same name is how pytest receives one.
"server/tests/**" = ["F811"]
